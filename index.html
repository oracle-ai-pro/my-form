<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMSH 2.0 Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <button onclick="toggleToolsMenu()" style="background:#6c757d;">🛠️ Tools</button>
        <button onclick="switchScreen('login')" style="background:#007bff;">🔐 Админка</button>
    </div>

    <div id="quiz-screen" class="quiz-container">
        <div id="quiz-box">
            <div id="question-body"></div>
            <button id="next-btn" onclick="nextStep()" style="width:100%; margin-top:20px;">Далее</button>
        </div>
        <div id="result-box" class="hidden">...</div>
    </div>

    <div id="admin-screen" class="hidden quiz-container">
        <h2>Панель администратора</h2>
        <div class="admin-box">
            <h3>Добавить вопрос:</h3>
            <select id="new-type" onchange="toggleAdminFields()" class="admin-input">
                <option value="radio">Одиночный (Radio)</option>
                <option value="checkbox">Множественный (Checkbox)</option>
                <option value="select">Список (Select)</option>
                <option value="text">Текст</option>
            </select>
            
            <input type="text" id="new-title" class="admin-input" placeholder="Текст вопроса">
            
            <div style="display:flex; gap:10px; flex-wrap:wrap; margin:10px 0;">
                <label><input type="checkbox" id="new-required" checked> Обязательный</label>
                <label><input type="checkbox" id="toggle-timer-input" onchange="document.getElementById('timer-val-box').classList.toggle('hidden', !this.checked)"> Таймер</label>
            </div>

            <div id="timer-val-box" class="hidden"><input type="number" id="new-timer" value="20" class="admin-input" placeholder="Секунды"></div>

            <div id="admin-choices-fields">
                <input type="text" id="new-options" class="admin-input" placeholder="Варианты (через запятую)">
                <input type="text" id="new-correct-choices" class="admin-input" placeholder="Индексы верных (0,1)">
            </div>
            <div id="admin-text-fields" class="hidden">
                <input type="text" id="new-correct-text" class="admin-input" placeholder="Верные ответы (через запятую)">
            </div>

            <button onclick="addQuestion()" style="background:#28a745; width:100%;">Сохранить</button>
        </div>
        <div id="admin-questions-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
