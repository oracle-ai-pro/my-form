<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>My easy form | Prestige HQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="quiz-screen" class="quiz-container">...</div>
    <div id="login-screen" class="hidden quiz-container">...</div>
    
    <div id="admin-screen" class="hidden quiz-container">
        <h2>Админка LMSH 2.0</h2>
        <div class="admin-box">
            <h3 id="admin-form-title">Добавить новый вопрос</h3>
            <input type="hidden" id="edit-index" value="-1">
            <label>Вопрос:</label>
            <input type="text" id="new-title" class="admin-input">
            <label>Тип:</label>
            <select id="new-type" class="admin-input" onchange="toggleAdminFields()">
                <option value="radio">Один выбор</option>
                <option value="checkbox">Несколько</option>
                <option value="text">Текст</option>
            </select>
            
            <div id="admin-choices-fields">
                <input type="text" id="new-options" placeholder="Варианты через запятую">
                <input type="text" id="new-correct-choices" placeholder="Индексы ответов (0,1)">
            </div>
            <div id="admin-text-fields" class="hidden">
                <input type="text" id="new-correct-text" placeholder="Правильный текст">
            </div>

            <button onclick="addQuestion()" id="save-btn" style="background:#28a745;">Сохранить вопрос</button>
            <button onclick="changeAdminAuth()" style="background:#ffc107;">🔐 Сменить пароль</button>
            <button onclick="logout()">Выход</button>
        </div>
        <div id="admin-questions-list"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
