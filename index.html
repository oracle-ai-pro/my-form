<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>My easy form | Prestige HQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container" style="display: flex; gap: 10px;">
        <div style="position: relative; flex: 1;"><button onclick="toggleToolsMenu()" class="tool-btn">🛠️ Tools</button>
            <div id="tools-menu" class="hidden">
                <div class="menu-item" onclick="setTheme('light')">☀️ Светлая</div>
                <div class="menu-item" onclick="setTheme('dark')">🌙 Темная</div>
            </div>
        </div>
        <div style="flex: 1;"><button onclick="switchScreen('login')" class="tool-btn">🔐 Admin</button></div>
    </div>

    <div id="start-screen" class="quiz-container">
        <h2>Добро пожаловать</h2>
        <input type="text" id="user-name" class="admin-input" placeholder="Имя и Фамилия">
        <button onclick="startQuiz()">Начать тест</button>
    </div>

    <div id="quiz-screen" class="quiz-container hidden">
        <div id="question-body"></div>
        <button onclick="nextStep()">Далее</button>
    </div>

    <div id="result-screen" class="quiz-container hidden">
        <h2>Ваш результат</h2>
        <div id="score-display"></div>
        <button onclick="copyResult()">📋 Копировать ответы</button>
        <button onclick="downloadResult()">💾 Скачать .txt</button>
    </div>

    <div id="login-screen" class="quiz-container hidden">
        <input type="password" id="login-pass" class="admin-input" placeholder="Пароль">
        <button onclick="tryLogin()">Войти</button>
    </div>

    <div id="admin-screen" class="quiz-container hidden">
        <h2>Админка</h2>
        <input type="text" id="new-title" class="admin-input" placeholder="Вопрос">
        <input type="number" id="new-points" class="admin-input" placeholder="Баллы">
        <select id="new-type" class="admin-input"><option value="radio">Radio</option><option value="text">Текст</option></select>
        <button onclick="addQuestion()" style="background:#28a745;">➕ Сохранить</button>
        <div id="admin-questions-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
