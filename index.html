<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMSH 2.0 Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <div style="position: relative;">
            <button onclick="toggleToolsMenu()" style="background:#6c757d;">🛠️ Tools for User ▼</button>
            <div id="tools-menu" class="hidden" style="position:absolute; top:40px; left:0; background:#fff; border:1px solid #ddd; padding:10px; z-index:100; border-radius:6px; box-shadow:0 4px 10px rgba(0,0,0,0.2);">
                <div style="cursor:pointer; padding:5px;" onclick="setTheme('light')">☀️ Светлая тема</div>
                <div style="cursor:pointer; padding:5px;" onclick="setTheme('dark')">🌙 Темная тема</div>
                <div style="cursor:pointer; padding:5px; color:#17a2b8;" onclick="generateShareLink()">🔗 Сжать ссылку</div>
            </div>
        </div>
        <button onclick="switchScreen('login')" style="background:#007bff;">🔐 Админка</button>
    </div>

    <div id="quiz-screen" class="quiz-container">
        <div id="quiz-box">
            <div id="question-body"></div>
            <button id="next-btn" onclick="nextStep()" style="width:100%; margin-top:20px;">Далее</button>
        </div>
        <div id="result-box" class="hidden"></div>
    </div>

    <div id="admin-screen" class="hidden quiz-container">
        <h2>Админка LMSH 2.0</h2>
        <div class="admin-box">
            <select id="new-type" class="admin-input" onchange="toggleAdminFields()">
                <option value="radio">Одиночный (Radio)</option>
                <option value="checkbox">Множественный (Checkbox)</option>
                <option value="text">Текст</option>
            </select>
            <input type="text" id="new-title" class="admin-input" placeholder="Вопрос">
            
            <div style="margin:10px 0;">
                <label><input type="checkbox" id="new-required"> Обязательный</label>
                <label><input type="checkbox" id="toggle-timer-input" onchange="document.getElementById('timer-val-box').classList.toggle('hidden', !this.checked)"> Таймер</label>
            </div>
            <div id="timer-val-box" class="hidden"><input type="number" id="new-timer" class="admin-input" value="20"></div>

            <div id="admin-choices-fields">
                <input type="text" id="new-options" class="admin-input" placeholder="Варианты (через запятую)">
                <input type="text" id="new-correct-choices" class="admin-input" placeholder="Индексы (0,1)">
            </div>
            <div id="admin-text-fields" class="hidden">
                <input type="text" id="new-correct-text" class="admin-input" placeholder="Верные ответы (через запятую)">
            </div>

            <button onclick="addQuestion()" style="background:#28a745; width:100%;">Сохранить</button>
        </div>
        
        <div class="admin-box" style="margin-top:20px;">
            <h3>🔑 Расшифровать код</h3>
            <input type="text" id="decode-input" class="admin-input" placeholder="Вставьте код ученика...">
            <button onclick="decodeStudentCode()" style="background:#17a2b8; width:100%;">Проверить</button>
            <div id="decode-result"></div>
        </div>
        <div id="admin-questions-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
