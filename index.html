<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My easy form | Prestige HQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container" style="margin-bottom: 10px; padding: 10px; display: flex; justify-content: space-between; align-items: center;">
        <div style="position: relative;">
            <button onclick="toggleToolsMenu()" style="margin: 0; padding: 5px 10px; background: #6c757d;">🛠️ Tools for User</button>
            <div id="tools-menu" class="hidden" style="position: absolute; top: 35px; left: 0; background: inherit; border: 1px solid #ddd; border-radius: 4px; padding: 10px; z-index: 100; min-width: 180px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                <button onclick="setTheme('light')" style="width: 100%; margin-bottom: 5px; background: #f4f4f9; color: #333;">☀️ Светлая тема</button>
                <button onclick="setTheme('dark')" style="width: 100%; margin-bottom: 5px; background: #333; color: #fff;">🌙 Темная тема</button>
                <button onclick="generateShareLink()" style="width: 100%; background: #17a2b8;">🚀 Сжать ссылку</button>
            </div>
        </div>
        <button onclick="switchScreen('login')" style="margin: 0; padding: 5px 10px; background: #007bff;">🔐 Админка</button>
    </div>

    <div id="quiz-screen" class="quiz-container">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold;">
            <span>Вопрос <span id="current-number">0</span> из <span id="total-number">0</span></span>
            <span id="timer-display" class="hidden" style="color: #dc3545;">⏱️ <span id="timer-seconds">0</span> сек.</span>
        </div>
        
        <div style="background: #e9ecef; border-radius: 4px; height: 8px; margin-bottom: 20px; overflow: hidden;">
            <div id="progress" style="background: #007bff; width: 0%; height: 100%; transition: width 0.3s ease;"></div>
        </div>

        <div id="quiz-box">
            <div id="question-body"></div>
            <button id="next-btn" onclick="nextStep()" style="margin-top: 20px; width: 100%;">Далее</button>
        </div>

        <div id="result-box" class="hidden">
            <h2>Тест завершен!</h2>
            <div class="result-card" style="padding: 15px; margin-bottom: 15px; border-radius: 6px;">
                <p>Ваш результат: <span id="final-score" style="font-size: 24px; font-weight: bold; color: #28a745;">0 / 0</span></p>
            </div>
            <div id="review-box" style="margin-top: 20px;"></div>
            <button onclick="restartQuiz()" style="margin-top: 20px; width: 100%; background-color: #6c757d;">Пройти заново</button>
        </div>
        
        <div style="margin-top: 15px; text-align: center;">
            <a id="leave-shared-btn" href="#" class="hidden" style="color: #6c757d; text-decoration: none; font-size: 14px; font-weight: bold;">↩ Вернуться к своим вопросам</a>
        </div>
    </div>

    <div id="login-screen" class="hidden quiz-container">
        <h2>Вход в панель управления</h2>
        <div class="admin-box">
            <label>Логин:</label>
            <input type="text" id="login-user" class="admin-input">
            <label>Пароль:</label>
            <input type="password" id="login-pass" class="admin-input">
            <button onclick="tryLogin()" style="width: 100%; margin-top: 15px;">Войти</button>
            <button onclick="logout()" style="width: 100%; background-color: #6c757d; margin-top: 5px;">Назад к тесту</button>
        </div>
    </div>
    
    <div id="admin-screen" class="hidden quiz-container">
        <h2>Админка LMSH 2.0</h2>
        <div class="admin-box">
            <h3 id="admin-form-title">Добавить новый вопрос</h3>
            <input type="hidden" id="edit-index" value="-1">
            <label>Вопрос:</label>
            <input type="text" id="new-title" class="admin-input">
            <label>Тип:</label>
            <select id="new-type" class="admin-input" onchange="toggleAdminFields()">
                <option value="radio">Один выбор</option>
                <option value="checkbox">Несколько</option>
                <option value="text">Текст</option>
            </select>
            
            <div id="admin-choices-fields">
                <input type="text" id="new-options" placeholder="Варианты через запятую">
                <input type="text" id="new-correct-choices" placeholder="Индексы ответов (0,1)">
            </div>
            <div id="admin-text-fields" class="hidden">
                <input type="text" id="new-correct-text" placeholder="Правильный текст">
            </div>

            <button onclick="addQuestion()" id="save-btn" style="background:#28a745;">Сохранить вопрос</button>
            <button onclick="changeAdminAuth()" style="background:#ffc107; color: black;">🔐 Сменить пароль</button>
            <button onclick="logout()">Выход</button>
        </div>

        <div class="admin-box" style="margin-top: 20px; border-top: 2px dashed #007bff; padding-top: 15px;">
            <h3>🔑 Проверить код ответа ученика</h3>
            <input type="text" id="decode-input" class="admin-input" placeholder="Вставьте скопированный код ученика сюда...">
            <button onclick="decodeStudentCode()" style="background: #17a2b8; width: 100%; margin-top: 10px;">Расшифровать данные</button>
            <div id="decode-result" style="margin-top: 15px; text-align: left; font-size: 14px;"></div>
        </div>

        <div id="admin-questions-list" style="margin-top: 20px;"></div>
    </div>

    <script src="script.js"></script>
    
    <script>
        function decodeStudentCode() {
            const code = document.getElementById('decode-input').value.trim();
            const resultDiv = document.getElementById('decode-result');
            if(!code) { alert("Вставьте код!"); return; }
            try {
                const decodedString = decodeURIComponent(atob(code));
                const data = JSON.parse(decodedString);
                
                let html = `<div style="background: rgba(23,162,184,0.1); padding: 10px; border-radius: 6px; border: 1px solid #17a2b8;">`;
                html += `<p>👤 <strong>Ученик:</strong> ${data.student}</p>`;
                html += `<p>🎯 <strong>Результат:</strong> ${data.score}</p>`;
                html += `<p>📅 <strong>Дата сдачи:</strong> ${data.date}</p><hr style="border: 0; border-top: 1px solid #ccc;">`;
                
                data.answers.forEach((ans, i) => {
                    html += `<p style="margin: 4px 0;"><strong>${i+1}. ${ans.q}</strong><br>Ответ: <span style="color:${ans.correct ? 'green' : 'red'}">${ans.ans || '[Нет ответа]'}</span> (${ans.correct ? 'ВЕРНО' : 'НЕВЕРНО'})</p>`;
                });
                html += `</div>`;
                resultDiv.innerHTML = html;
            } catch(e) {
                resultDiv.innerHTML = `<span style="color:red;">❌ Ошибка расшифровки! Код поврежден или изменен.</span>`;
            }
        }
    </script>
</body>
</html>
