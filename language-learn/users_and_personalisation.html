<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки и Участники | Language Learn</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-card: #ffffff;
            --bg-body: #f3f4f6;
            --bg-option-hover: #f9fafb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success: #10b981;
            --danger: #ef4444;
            --radius-mid: 12px;
            --radius-max: 20px;
        }

        body.dark-theme {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-card: #1f2937;
            --bg-body: #111827;
            --bg-option-hover: #374151;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .quiz-container {
            width: 100%;
            max-width: 600px;
            background: var(--bg-card);
            border-radius: var(--radius-max);
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .hidden { display: none !important; }

        button {
            width: 100%;
            padding: 12px 18px;
            border: none;
            border-radius: var(--radius-mid);
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        button:hover { background: var(--primary-hover); }

        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover { background: var(--bg-option-hover); }

        .admin-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-mid);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 14px;
            margin-top: 4px;
            margin-bottom: 12px;
            outline: none;
        }

        .admin-input:focus { border-color: var(--primary); }

        /* Переключатели / Тумблеры */
        .switch-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 24px;
            flex-shrink: 0;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(18px); }

        /* Карточка печати */
        .print-card {
            border: 2px dashed var(--primary);
            padding: 15px;
            border-radius: var(--radius-mid);
            background: var(--bg-option-hover);
            margin-top: 15px;
            text-align: center;
        }

        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area { 
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 100%; 
                border: 2px solid #000; 
                padding: 20px;
                color: #000;
                background: #fff;
            }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- Шапка страницы -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0; display: flex; align-items: center; gap: 8px;">
            <span class="material-symbols-rounded" style="color: var(--primary);">settings</span> Настройки и Участники
        </h2>
        <button class="btn-secondary" onclick="window.location.href='index.html'" style="width: auto; margin: 0; padding: 8px 14px; font-size: 13px;">
            <span class="material-symbols-rounded">arrow_back</span> Выйти отсюда
        </button>
    </div>

    <!-- 1. КОНСТРУКТОР СОЗДАНИЯ УЧАСТНИКА -->
    <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px;">
        <h3 style="margin-top: 0;">👤 Создать Участника</h3>
        
        <label style="font-size:12px; font-weight:bold;">Имя и Фамилия:</label>
        <input type="text" id="new-member-name" class="admin-input" placeholder="Например: Иван Иванов">

        <label style="font-size:12px; font-weight:bold;">Логин:</label>
        <input type="text" id="new-member-login" class="admin-input" placeholder="Например: user123">

        <label style="font-size:12px; font-weight:bold;">Пин / Пароль:</label>
        <input type="text" id="new-member-pin" class="admin-input" placeholder="Например: 8899">

        <button onclick="generateMemberCard()">
            <span class="material-symbols-rounded">badge</span> Сформировать карточку
        </button>

        <!-- КАРТОЧКА ДЛЯ ПЕЧАТИ -->
        <div id="card-preview" class="hidden">
            <div id="printable-area" class="print-card">
                <h3 style="margin: 0 0 5px 0;">🎓 Language Learn</h3>
                <p style="margin: 4px 0;">Участник: <strong id="card-name">-</strong></p>
                <p style="margin: 4px 0;">Логин: <strong id="card-login">-</strong> | Пин: <strong id="card-pin">-</strong></p>
                <small style="color: var(--text-muted);">Сохраняйте эти данные для входа в систему</small>
            </div>
            
            <button class="btn-secondary" onclick="window.print()" style="margin-top: 10px;">
                <span class="material-symbols-rounded">print</span> Распечатать карточку
            </button>
        </div>
    </div>

    <!-- 2. ТУМБЛЕРЫ КАСТОМИЗАЦИИ -->
    <div>
        <h3 style="margin-top: 0;">🛠️ Настройки страницы и прав</h3>

        <label class="switch-label">
            <span class="switch">
                <input type="checkbox" id="toggle-auto-lessons" onchange="saveSettings()">
                <span class="slider"></span>
            </span>
            1. Разрешить уроки от My Form Автоматические
        </label>

        <div style="margin-top: 15px; border-top: 1px dashed var(--border-color); padding-top: 15px;">
            <label style="font-size:14px; font-weight:bold; display:block; margin-bottom:10px;">2. Что могут участники:</label>
            
            <label class="switch-label">
                <span class="switch">
                    <input type="checkbox" id="allow-create-forms" onchange="saveSettings()">
                    <span class="slider"></span>
                </span>
                Создавать собственные формы и тесты
            </label>

            <label class="switch-label">
                <span class="switch">
                    <input type="checkbox" id="allow-view-results" onchange="saveSettings()" checked>
                    <span class="slider"></span>
                </span>
                Просматривать ответы и разборы после теста
            </label>
        </div>
    </div>
</div>

<script>
    window.onload = () => {
        // Установка сохраненной темы
        const savedTheme = localStorage.getItem('quiz_theme') || 'light';
        if (savedTheme === 'dark') document.body.classList.add('dark-theme');

        // Загрузка настроек
        const settings = JSON.parse(localStorage.getItem('lang_settings')) || {
            autoLessons: true,
            allowCreateForms: false,
            allowViewResults: true
        };

        document.getElementById('toggle-auto-lessons').checked = settings.autoLessons;
        document.getElementById('allow-create-forms').checked = settings.allowCreateForms;
        document.getElementById('allow-view-results').checked = settings.allowViewResults;
    };

    function generateMemberCard() {
        const name = document.getElementById('new-member-name').value.trim();
        const login = document.getElementById('new-member-login').value.trim();
        const pin = document.getElementById('new-member-pin').value.trim();

        if (!name || !login || !pin) return alert("Заполните все поля для создания участника!");

        document.getElementById('card-name').innerText = name;
        document.getElementById('card-login').innerText = login;
        document.getElementById('card-pin').innerText = pin;
        document.getElementById('card-preview').classList.remove('hidden');

        // Сохранение нового участника
        let users = JSON.parse(localStorage.getItem('lang_users')) || [];
        users.push({ 
            type: 'user', 
            name, 
            login, 
            pin, 
            completedLessons: 0, 
            orgName: 'Главный Штаб' 
        });
        localStorage.setItem('lang_users', JSON.stringify(users));
    }

    function saveSettings() {
        const settings = {
            autoLessons: document.getElementById('toggle-auto-lessons').checked,
            allowCreateForms: document.getElementById('allow-create-forms').checked,
            allowViewResults: document.getElementById('allow-view-results').checked
        };
        localStorage.setItem('lang_settings', JSON.stringify(settings));
    }
</script>

</body>
</html>
