<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch Lernen: Главная</title>
    <style>
        :root {
            --bg-body: #f0f2f5; 
            --bg-card: #ffffff; 
            --text-main: #212529; 
            --text-muted: #6c757d; 
            --border-color: #e9ecef; 
            --bg-option-hover: #f8f9fa; 
            --primary: #007bff; 
            --primary-hover: #0056b3; 
            --gray: #6c757d;
            --radius-max: 24px; 
            --radius-mid: 14px;  
        }

        body.dark-theme {
            --bg-body: #050505; 
            --bg-card: #0f0f0f; 
            --text-main: #f0f2f5; 
            --text-muted: #a0a0a0;
            --border-color: #222222; 
            --bg-option-hover: #1a1a1a; 
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-body); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            transition: 0.3s; 
            color: var(--text-main); 
        }

        .header-actions {
            width: 100%;
            max-width: 660px;
            display: flex;
            justify-content: flex-end;
        }

        .theme-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: var(--radius-mid);
            cursor: pointer;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--bg-card);
            padding: 30px;
            border-radius: var(--radius-max);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            margin-top: 20px;
        }

        h1 { color: var(--text-main); text-align: center; margin-bottom: 5px; }
        .subtitle { color: var(--text-muted); text-align: center; margin-bottom: 30px; }

        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lesson-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-mid);
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .lesson-card:hover {
            background: var(--bg-option-hover);
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .lesson-info h3 { margin: 0 0 5px 0; font-size: 1.2rem; }
        .lesson-info p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }

        .start-btn {
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            border-radius: var(--radius-mid);
            font-weight: bold;
            font-size: 0.9rem;
        }
        .lesson-card:hover .start-btn { background: var(--primary-hover); }
        
        .disabled-card {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .disabled-card .start-btn { background: var(--gray); }
        .disabled-card:hover { transform: none; border-color: var(--border-color); background: var(--bg-card); }
    </style>
</head>
<body>

<div class="header-actions">
    <button class="theme-btn" onclick="toggleTheme()">🌓 Theme</button>
</div>

<div class="container">
    <h1>Deutsch Übungen</h1>
    <p class="subtitle">Выбери тему для практики немецкого языка</p>

    <div class="lessons-list">
        <!-- Активный урок 1 -->
        <a href="lektion1.html" class="lesson-card">
            <div class="lesson-info">
                <h3>Lektion 1: Akkusativ</h3>
                <p>Склонение артиклей в винительном падеже</p>
            </div>
            <div class="start-btn">Start</div>
        </a>

        <!-- Заглушка для урока 2 -->
        <div class="lesson-card disabled-card">
            <div class="lesson-info">
                <h3>Lektion 2: Dativ (Скоро)</h3>
                <p>Практика дательного падежа</p>
            </div>
            <div class="start-btn">🔒</div>
        </div>

        <!-- Заглушка для урока 3 -->
        <div class="lesson-card disabled-card">
            <div class="lesson-info">
                <h3>Lektion 3: Wechselpräpositionen (Скоро)</h3>
                <p>Предлоги двойного управления</p>
            </div>
            <div class="start-btn">🔒</div>
        </div>
    </div>
</div>

<script>
    // Проверяем тему при загрузке
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-theme');
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-theme');
        const isDark = document.body.classList.contains('dark-theme');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
</script>

</body>
</html>
